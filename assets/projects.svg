<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Projects slider: OEEnova (machine and production intelligence) and AZHR ORBIT (HR and people intelligence)">
  <defs>
    <linearGradient id="gOee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f8a7f"/>
      <stop offset="1" stop-color="#0b3d4a"/>
    </linearGradient>
    <linearGradient id="gAz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b2fb0"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="290" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      /* 16 s loop: OEEnova 0-7.5 s, AZHR ORBIT 8-15.5 s */
      .track { animation: slide 16s cubic-bezier(.7,0,.3,1) infinite; }
      @keyframes slide { 0%, 45% { transform: translateX(0); } 50%, 95% { transform: translateX(-1200px); } 100% { transform: translateX(0); } }
      .line { opacity: 0; animation: line 16s infinite; }
      @keyframes line { 0% { opacity: 0; transform: translateY(8px); } 2%, 13% { opacity: 1; transform: none; } 15.6%, 100% { opacity: 0; transform: translateY(-8px); } }
      .o1 { animation-delay: 0s; } .o2 { animation-delay: 2.5s; } .o3 { animation-delay: 5s; }
      .a1 { animation-delay: 8s; } .a2 { animation-delay: 10.5s; } .a3 { animation-delay: 13s; }
      .dotA { animation: dotA 16s infinite; } .dotB { animation: dotB 16s infinite; }
      @keyframes dotA { 0%, 47% { width: 26px; fill: #ffffff; } 50%, 97% { width: 8px; fill: #ffffff80; } 100% { width: 26px; fill: #ffffff; } }
      @keyframes dotB { 0%, 47% { width: 8px; fill: #ffffff80; } 50%, 97% { width: 26px; fill: #ffffff; } 100% { width: 8px; fill: #ffffff80; } }
      .orbit { transform-origin: 90px 145px; animation: spin 9s linear infinite; }
      .orbit2 { transform-origin: 90px 145px; animation: spin 14s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .gauge { stroke-dasharray: 214; stroke-dashoffset: 214; animation: gauge 16s ease-out infinite; }
      @keyframes gauge { 0% { stroke-dashoffset: 214; } 12%, 100% { stroke-dashoffset: 54; } }
      .bar { transform-box: fill-box; transform-origin: left; animation: grow 2.5s linear infinite; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <g class="track">
      <!-- ============ slide 1: OEEnova ============ -->
      <rect width="1200" height="290" fill="url(#gOee)"/>
      <circle cx="90" cy="145" r="34" fill="none" stroke="#0b3d4a" stroke-width="12"/>
      <circle class="gauge" cx="90" cy="145" r="34" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" transform="rotate(-90 90 145)"/>
      <path d="M107 106Q108.8 114.6 117.5 116.4Q108.8 118.2 107 126.8Q105.2 118.2 96.5 116.4Q105.2 114.6 107 106Z" fill="#f6b443"/>
      <text x="40" y="40" fill="#bff3ea" font-size="13" letter-spacing="2.5">PROJECT 01 · MANUFACTURING</text>
      <text x="150" y="130" fill="#ffffff" font-size="42" font-weight="700"><tspan fill="#bff3ea">OEE</tspan>nova</text>
      <text x="152" y="162" fill="#e7f6f3" font-size="18">Every machine. Every cycle. <tspan fill="#f6b443" font-weight="700">Brighter.</tspan></text>
      <text x="152" y="190" fill="#bff3ea" font-size="15">Machine &amp; production intelligence for every machine type</text>
      <g fill="#ffffff" fill-opacity=".14" stroke="#bff3ea" stroke-opacity=".35">
        <rect x="152" y="212" width="92" height="26" rx="13"/><rect x="252" y="212" width="120" height="26" rx="13"/><rect x="380" y="212" width="126" height="26" rx="13"/>
      </g>
      <g fill="#e7f6f3" font-size="13" font-weight="600">
        <text x="167" y="230">20 families</text><text x="267" y="230">Loss in PKR</text><text x="395" y="230">Urdu + English</text>
      </g>
      <g transform="translate(700 75)">
        <rect width="450" height="120" rx="14" fill="#06262b" fill-opacity=".55" stroke="#bff3ea" stroke-opacity=".25"/>
        <text x="22" y="32" fill="#9fd9cf" font-size="12" letter-spacing="2">ENGINES</text>
        <g class="line o1"><text x="22" y="68" fill="#ffffff" font-size="22" font-weight="700">Live OEE + Loss Ledger</text><text x="22" y="94" fill="#bff3ea" font-size="14">Every lost minute counted once, in rupees</text></g>
        <g class="line o2"><text x="22" y="68" fill="#ffffff" font-size="22" font-weight="700">Machine DNA · 20 families</text><text x="22" y="94" fill="#bff3ea" font-size="14">From the 1000T press to the PU foam line</text></g>
        <g class="line o3"><text x="22" y="68" fill="#ffffff" font-size="22" font-weight="700">WhatsApp &amp; e-mail alerts</text><text x="22" y="94" fill="#bff3ea" font-size="14">Plus an Urdu operator tablet that works offline</text></g>
        <rect class="bar" x="0" y="116" width="450" height="4" rx="2" fill="#f6b443"/>
      </g>

      <!-- ============ slide 2: AZHR ORBIT ============ -->
      <g transform="translate(1200 0)">
        <rect width="1200" height="290" fill="url(#gAz)"/>
        <circle cx="90" cy="145" r="12" fill="#f6b443"/>
        <g class="orbit"><ellipse cx="90" cy="145" rx="46" ry="18" fill="none" stroke="#c9bcff" stroke-opacity=".7" stroke-width="2"/><circle cx="136" cy="145" r="5" fill="#ffffff"/></g>
        <g class="orbit2"><ellipse cx="90" cy="145" rx="20" ry="44" fill="none" stroke="#c9bcff" stroke-opacity=".45" stroke-width="2"/><circle cx="90" cy="101" r="4" fill="#9ff0e2"/></g>
        <text x="40" y="40" fill="#d8cffc" font-size="13" letter-spacing="2.5">PROJECT 02 · PEOPLE</text>
        <text x="150" y="130" fill="#ffffff" font-size="42" font-weight="700">AZHR <tspan fill="#c9bcff">ORBIT</tspan><tspan font-size="18" dy="-18" fill="#c9bcff">™</tspan></text>
        <text x="152" y="162" fill="#ece7fb" font-size="18">HR &amp; people intelligence for growing companies</text>
        <text x="152" y="190" fill="#d8cffc" font-size="15">Attendance · payroll · fairness · skills · Urdu voice</text>
        <g fill="#ffffff" fill-opacity=".12" stroke="#d8cffc" stroke-opacity=".4">
          <rect x="152" y="212" width="112" height="26" rx="13"/><rect x="272" y="212" width="104" height="26" rx="13"/><rect x="384" y="212" width="130" height="26" rx="13"/>
        </g>
        <g fill="#ece7fb" font-size="13" font-weight="600">
          <text x="167" y="230">ADL Lock™</text><text x="287" y="230">Voice AI</text><text x="399" y="230">Multi-company</text>
        </g>
        <g transform="translate(700 75)">
          <rect width="450" height="120" rx="14" fill="#120d2e" fill-opacity=".55" stroke="#d8cffc" stroke-opacity=".25"/>
          <text x="22" y="32" fill="#c9bcff" font-size="12" letter-spacing="2">MODULES</text>
          <g class="line a1"><text x="22" y="68" fill="#ffffff" font-size="22" font-weight="700">Core HR</text><text x="22" y="94" fill="#d8cffc" font-size="14">Employees, attendance and payroll in one place</text></g>
          <g class="line a2"><text x="22" y="68" fill="#ffffff" font-size="22" font-weight="700">ADL Lock™ fairness engine</text><text x="22" y="94" fill="#d8cffc" font-size="14">KPIs, goals, appeals, skills matrix, kaizen</text></g>
          <g class="line a3"><text x="22" y="68" fill="#ffffff" font-size="22" font-weight="700">Voice AI in Urdu</text><text x="22" y="94" fill="#d8cffc" font-size="14">Workers give feedback by voice · WhatsApp</text></g>
          <rect class="bar" x="0" y="116" width="450" height="4" rx="2" fill="#9ff0e2"/>
        </g>
      </g>
    </g>

    <!-- slider dots -->
    <rect class="dotA" x="562" y="262" width="26" height="8" rx="4" fill="#ffffff"/>
    <rect class="dotB" x="596" y="262" width="8" height="8" rx="4" fill="#ffffff80"/>
  </g>
</svg>
