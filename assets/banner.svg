<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Adnan Zafar — manufacturing and software, building OEEnova and AZHR ORBIT, Karachi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset=".55" stop-color="#0e1e26"/>
      <stop offset="1" stop-color="#0c2a28"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#9ff0e2"/>
      <stop offset="1" stop-color="#f6b443"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#35c9b4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#35c9b4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#35c9b4" stroke-opacity=".08"/>
    </pattern>
    <style>
      .ring { fill: none; stroke: #35c9b4; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 402; stroke-dashoffset: 402; animation: fill 2.4s cubic-bezier(.2,.8,.2,1) .4s forwards; }
      .track { fill: none; stroke: #223140; stroke-width: 14; }
      .ram { animation: ram 2s cubic-bezier(.6,0,.4,1) infinite; }
      .part { animation: belt 2s linear infinite; }
      .part2 { animation-delay: -1s; }
      .spark { transform-box: fill-box; transform-origin: center; animation: spark 2s infinite; }
      .rise { opacity: 0; animation: rise .8s ease-out forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .8s; } .d4 { animation-delay: 1.1s; }
      .glow { animation: float 8s ease-in-out infinite alternate; }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes fill { to { stroke-dashoffset: 100; } }
      @keyframes ram { 0%, 40%, 100% { transform: translateY(0); } 55%, 65% { transform: translateY(34px); } }
      @keyframes belt { 0% { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateX(210px); opacity: 0; } }
      @keyframes spark { 0%, 54% { opacity: 0; transform: scale(.3); } 58% { opacity: 1; transform: scale(1.5); } 70%, 100% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes float { from { transform: translate(0, 0); } to { transform: translate(-60px, 30px); } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle class="glow" cx="980" cy="120" r="260" fill="url(#glow)"/>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text class="rise d1" x="60" y="92" fill="#9bacbb" font-size="18" letter-spacing="3">ASSALAM O ALAIKUM, I'M</text>
    <text class="rise d2" x="58" y="152" fill="url(#title)" font-size="58" font-weight="700">Adnan Zafar</text>
    <text class="rise d3" x="60" y="196" fill="#dbe5ee" font-size="22">Manufacturing × software · building <tspan fill="#35c9b4" font-weight="700">OEE</tspan><tspan fill="#ffffff" font-weight="700">nova</tspan> + <tspan fill="#c9bcff" font-weight="700">AZHR ORBIT</tspan></text>
    <text class="rise d4" x="60" y="236" fill="#9bacbb" font-size="17">Presses · sheet metal · molds · welding · CNC  →  machine &amp; people intelligence</text>
    <g class="rise d4">
      <rect x="60" y="258" width="196" height="30" rx="15" fill="#35c9b4" fill-opacity=".12" stroke="#35c9b4" stroke-opacity=".4"/>
      <circle cx="80" cy="273" r="5" fill="#3fcf8e" class="blink"/>
      <text x="94" y="279" fill="#bff3ea" font-size="14" font-weight="600">Karachi, Pakistan</text>
    </g>
  </g>

  <!-- OEE gauge -->
  <g transform="translate(720 90)">
    <circle cx="70" cy="70" r="64" class="track"/>
    <circle cx="70" cy="70" r="64" class="ring" transform="rotate(-90 70 70)"/>
    <text x="70" y="78" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">OEE</text>
    <text x="70" y="100" text-anchor="middle" fill="#9bacbb" font-family="'Segoe UI', Arial, sans-serif" font-size="12">A × P × Q</text>
  </g>

  <!-- press line -->
  <g transform="translate(900 70)">
    <rect x="20" y="0" width="190" height="16" rx="4" fill="#2b3a4a"/>
    <rect x="26" y="16" width="14" height="120" rx="3" fill="#2b3a4a"/>
    <rect x="190" y="16" width="14" height="120" rx="3" fill="#2b3a4a"/>
    <g class="ram">
      <rect x="85" y="16" width="60" height="8" fill="#3b4d60"/>
      <rect x="62" y="24" width="106" height="24" rx="3" fill="#4c6378"/>
    </g>
    <rect x="62" y="104" width="106" height="12" rx="2" fill="#4c6378"/>
    <rect x="0" y="136" width="230" height="10" rx="3" fill="#2b3a4a"/>
    <rect class="part" x="0" y="96" width="34" height="7" rx="1.5" fill="#35c9b4"/>
    <rect class="part part2" x="0" y="96" width="34" height="7" rx="1.5" fill="#f6b443"/>
    <path class="spark" d="M113 88l4-9 4 9-9-4h10z" fill="#f6b443"/>
    <text x="115" y="176" text-anchor="middle" fill="#9ff0e2" fill-opacity=".55" font-family="Consolas, monospace" font-size="12">PRESS · 18 spm</text>
  </g>
</svg>
